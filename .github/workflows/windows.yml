name: windows

on:
  push:
    branches:
      - main

  pull_request:

  schedule:
    - cron: "0 5 * * 1"  # runs at 05:00 UTC on Mondays

  workflow_dispatch:

jobs:
  build:

    # Previously pinned to windows-2019 to avoid a "fatal error C1001:
    # Internal compiler error." with MSVC 2022 on windows-latest. GitHub has
    # since removed the windows-2019 runner label entirely, so pin to the
    # next-oldest available, well-established label (windows-2022) rather
    # than windows-latest/windows-2025, in case the MSVC ICE has not been
    # fully resolved. Revert to windows-latest if it's confirmed fixed.
    runs-on: windows-2022

    env:
      configuration: Release

    strategy:
      fail-fast: true
      max-parallel: 4

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          auto-activate-base: true
          activate-environment: ''
      - name: Conda Environment
        shell: powershell
        run: |
          conda config --set always_yes yes --set changeps1 no
          conda config --add channels conda-forge
          conda install conda-devenv
          conda-devenv
      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: $HOME\clcache
          key: ${{ runner.os }}-clcache
      - name: Configure
        shell: powershell
        run: |
          conda activate autodiff
          cmake -S . -B .build
      - name: Build
        shell: powershell
        run: |
          conda activate autodiff
          cmake --build .build --config ${{ env.configuration }}
      - name: Install
        shell: powershell
        run: |
          conda activate autodiff
          cmake --build .build --config ${{ env.configuration }} --target install
      - name: Test
        shell: powershell
        run: |
          conda activate autodiff
          cmake --build .build --config ${{ env.configuration }} --target tests
